<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2383e2">
  <link rel="manifest" href="manifest.json">
  <title>Notion-lite — Markdown Editor</title>

  <!-- Editor + parser -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
  <!-- Code highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hl-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hl-dark" disabled>

  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary:    #ffffff;
      --bg-secondary:  #f7f7f5;
      --bg-tertiary:   #efefec;
      --bg-overlay:    rgba(247,247,245,0.72);
      --border:        rgba(0,0,0,0.09);
      --border-mid:    rgba(0,0,0,0.14);
      --text-primary:  #1a1a1a;
      --text-secondary:#555;
      --text-muted:    #999;
      --accent:        #2383e2;
      --accent-bg:     #e8f1fb;
      --accent-text:   #185fa5;
      --accent-soft:   rgba(35,131,226,0.08);
      --success:       #3d9970;
      --danger:        #c0392b;
      --warning:       #b8860b;
      --sidebar-w:     240px;
      --outline-w:     200px;
      --shadow-md:     0 6px 20px rgba(0,0,0,0.10);
      --shadow-lg:     0 16px 40px rgba(0,0,0,0.18);
      --radius:        8px;
      --ease:          cubic-bezier(.2,.8,.2,1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary:    #191919;
        --bg-secondary:  #222222;
        --bg-tertiary:   #2a2a2a;
        --bg-overlay:    rgba(34,34,34,0.72);
        --border:        rgba(255,255,255,0.08);
        --border-mid:    rgba(255,255,255,0.13);
        --text-primary:  #e8e8e8;
        --text-secondary:#aaa;
        --text-muted:    #666;
        --accent:        #4a9ede;
        --accent-bg:     rgba(74,158,222,0.12);
        --accent-text:   #74b8f0;
        --accent-soft:   rgba(74,158,222,0.10);
        --success:       #4caf6e;
        --danger:        #e05c5c;
        --warning:       #d4a64a;
        --shadow-md:     0 6px 20px rgba(0,0,0,0.45);
        --shadow-lg:     0 16px 40px rgba(0,0,0,0.55);
      }
    }

    [data-theme="light"] {
      --bg-primary: #ffffff; --bg-secondary: #f7f7f5; --bg-tertiary: #efefec;
      --bg-overlay: rgba(247,247,245,0.72);
      --border: rgba(0,0,0,0.09); --border-mid: rgba(0,0,0,0.14);
      --text-primary: #1a1a1a; --text-secondary: #555; --text-muted: #999;
      --accent: #2383e2; --accent-bg: #e8f1fb; --accent-text: #185fa5;
      --accent-soft: rgba(35,131,226,0.08);
      --shadow-md: 0 6px 20px rgba(0,0,0,0.10);
      --shadow-lg: 0 16px 40px rgba(0,0,0,0.18);
    }
    [data-theme="dark"] {
      --bg-primary: #191919; --bg-secondary: #222; --bg-tertiary: #2a2a2a;
      --bg-overlay: rgba(34,34,34,0.72);
      --border: rgba(255,255,255,0.08); --border-mid: rgba(255,255,255,0.13);
      --text-primary: #e8e8e8; --text-secondary: #aaa; --text-muted: #666;
      --accent: #4a9ede; --accent-bg: rgba(74,158,222,0.12); --accent-text: #74b8f0;
      --accent-soft: rgba(74,158,222,0.10);
      --shadow-md: 0 6px 20px rgba(0,0,0,0.45);
      --shadow-lg: 0 16px 40px rgba(0,0,0,0.55);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
    }

    button { font-family: inherit; }

    /* ── App shell ────────────────────────────────────────── */
    #app { height: 100vh; display: flex; flex-direction: column; background: var(--bg-primary); }

    /* ── Top bar ──────────────────────────────────────────── */
    #topbar {
      display: flex; align-items: center;
      padding: 0 12px;
      height: 46px;
      background: var(--bg-overlay);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      gap: 10px; flex-shrink: 0;
      position: relative; z-index: 5;
    }
    #menu-btn { display: none; }

    .icon-btn {
      width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: none; cursor: pointer;
      color: var(--text-secondary); border-radius: 6px;
      transition: background .12s var(--ease), transform .08s var(--ease);
    }
    .icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .icon-btn:active { transform: scale(.94); }

    #note-title {
      flex: 1; min-width: 0;
      background: transparent; border: none; outline: none;
      color: var(--text-primary);
      font-size: 14px; font-weight: 500; font-family: inherit;
    }
    #note-title::placeholder { color: var(--text-muted); }

    .top-btn {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 12px; cursor: pointer;
      transition: background .12s var(--ease), transform .08s var(--ease);
    }
    .top-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .top-btn:active { transform: scale(.96); }
    .top-btn.pinned { color: var(--warning); border-color: var(--warning); }

    .word-count {
      font-size: 11px; color: var(--text-muted);
      padding: 0 6px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    #save-status {
      font-size: 11px; color: var(--text-muted);
      min-width: 56px; text-align: right;
      transition: color .2s;
    }
    #save-status.saving { color: var(--text-secondary); }
    #save-status.saved  { color: var(--success); }

    /* ── Main layout ──────────────────────────────────────── */
    #main { flex: 1; display: flex; overflow: hidden; }

    /* ── Sidebar ──────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      flex-shrink: 0; overflow: hidden;
    }
    #sidebar-head { padding: 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }

    #search-wrap {
      position: relative;
    }
    #search-input {
      width: 100%;
      padding: 6px 10px 6px 28px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 12px; font-family: inherit;
      outline: none;
      transition: border-color .12s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-icon {
      position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }

    .new-row { display: flex; gap: 6px; }
    #new-btn {
      flex: 1;
      padding: 6px 10px;
      background: var(--accent-bg);
      border: none; border-radius: 6px;
      color: var(--accent-text);
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: opacity .15s, transform .08s var(--ease);
    }
    #new-btn:hover  { opacity: .85; }
    #new-btn:active { transform: scale(.98); }
    #tpl-btn {
      width: 28px; padding: 0;
      background: var(--accent-bg); color: var(--accent-text);
      border: none; border-radius: 6px;
      font-size: 11px; cursor: pointer;
      transition: opacity .15s, transform .08s var(--ease);
    }
    #tpl-btn:hover  { opacity: .85; }
    #tpl-btn:active { transform: scale(.94); }

    #tag-bar {
      padding: 6px 10px;
      display: flex; flex-wrap: wrap; gap: 4px;
      border-bottom: 1px solid var(--border);
      max-height: 84px; overflow-y: auto;
    }
    .tag-pill {
      padding: 2px 8px;
      background: var(--bg-tertiary);
      border-radius: 999px;
      font-size: 10px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background .12s, color .12s;
      border: 1px solid transparent;
    }
    .tag-pill:hover { background: var(--accent-soft); }
    .tag-pill.active { background: var(--accent); color: white; }

    #notes-list { flex: 1; overflow-y: auto; padding: 4px 0; }

    .ni-section {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted);
      padding: 8px 12px 4px;
    }

    .ni {
      display: flex; align-items: center;
      padding: 7px 10px;
      cursor: pointer; gap: 8px;
      transition: background .1s var(--ease);
      position: relative;
    }
    .ni:hover { background: var(--bg-tertiary); }
    .ni.active { background: var(--accent-bg); }
    .ni.flash::after {
      content: ''; position: absolute; inset: 0;
      background: var(--success); opacity: 0; pointer-events: none;
      animation: flash .6s var(--ease);
    }
    @keyframes flash { 0% { opacity: .15 } 100% { opacity: 0 } }

    .ni-info { flex: 1; min-width: 0; }
    .ni-title {
      font-size: 12px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .ni.active .ni-title { color: var(--accent-text); }
    .ni-date { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .ni-pin  { color: var(--warning); font-size: 10px; }
    .ni-tags { display: flex; gap: 3px; margin-top: 2px; flex-wrap: wrap; }
    .ni-tag  { font-size: 9px; color: var(--text-muted); }

    .ni-actions { display: flex; gap: 2px; }
    .row-btn {
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 5px; border-radius: 4px;
      opacity: 0;
      font-size: 12px; line-height: 1;
      transition: opacity .1s, color .1s;
    }
    .ni:hover .row-btn { opacity: 1; }
    .pin-btn:hover  { color: var(--warning); }
    .del-btn:hover  { color: var(--danger); }
    .ni .pin-btn.is-pinned { opacity: 1; color: var(--warning); }

    /* ── Workspace ────────────────────────────────────────── */
    #workspace { flex: 1; display: flex; overflow: hidden; min-width: 0; }

    /* ── Editor pane ──────────────────────────────────────── */
    #editor-pane {
      flex: 1 1 50%;
      display: flex; flex-direction: column;
      overflow: hidden; min-width: 0;
    }

    .pane-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted);
      padding: 5px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex; justify-content: space-between; align-items: center;
    }

    #toolbar {
      display: flex; align-items: center;
      padding: 3px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      gap: 2px; flex-shrink: 0;
      overflow-x: auto;
    }
    #toolbar::-webkit-scrollbar { height: 0; }

    .tb {
      padding: 3px 8px;
      background: none; border: none;
      color: var(--text-secondary);
      cursor: pointer; border-radius: 5px;
      font-size: 11px; font-weight: 500;
      font-family: monospace;
      transition: background .1s, transform .08s var(--ease);
      line-height: 1.6;
      white-space: nowrap;
    }
    .tb:hover  { background: var(--bg-tertiary); color: var(--text-primary); }
    .tb:active { transform: scale(.94); }
    .tsep { width: 1px; height: 14px; background: var(--border-mid); margin: 0 3px; }

    #editor-wrap { flex: 1; overflow: hidden; position: relative; }

    /* ── Find bar ────────────────────────────────────────── */
    #find-bar {
      display: none;
      padding: 6px 10px;
      gap: 6px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    #find-bar.open { display: flex; }
    #find-bar input {
      flex: 1;
      padding: 4px 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-primary);
      font-size: 12px; outline: none;
    }
    #find-bar input:focus { border-color: var(--accent); }

    /* ── Drag handle ─────────────────────────────────────── */
    .resizer {
      width: 4px; cursor: col-resize;
      background: transparent;
      border-right: 1px solid var(--border);
      transition: background .15s;
      flex-shrink: 0;
    }
    .resizer:hover, .resizer.dragging { background: var(--accent); }

    /* ── Preview pane ─────────────────────────────────────── */
    #preview-pane {
      flex: 1 1 50%;
      display: flex; flex-direction: column;
      min-width: 0; overflow: hidden;
    }
    #preview-scroll {
      flex: 1; overflow-y: auto;
    }
    #preview-pane .pane-label { position: sticky; top: 0; z-index: 1; }
    #preview-body { padding: 28px 32px; }
    #empty-wrap {
      display: flex; align-items: center; justify-content: center;
      height: 60vh;
      color: var(--text-muted); font-size: 13px;
      flex-direction: column; gap: 14px;
    }
    #empty-wrap svg { opacity: .35; }

    #preview-content {
      max-width: 720px; line-height: 1.8;
      color: var(--text-primary); font-size: 14px;
      animation: fadein .25s var(--ease);
    }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }

    #preview-content h1, #preview-content h2, #preview-content h3, #preview-content h4 {
      margin: 1.4em 0 .45em; font-weight: 600; line-height: 1.3;
    }
    #preview-content h1 { font-size: 1.85em; }
    #preview-content h2 { font-size: 1.4em; }
    #preview-content h3 { font-size: 1.15em; }
    #preview-content h4 { font-size: 1em; color: var(--text-secondary); }
    #preview-content p { margin: .75em 0; }
    #preview-content code {
      background: var(--bg-tertiary);
      padding: 1px 5px; border-radius: 4px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Monaco', monospace;
      font-size: .88em;
    }
    #preview-content pre {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 1em 0;
      position: relative;
    }
    #preview-content pre code { background: none; padding: 0; font-size: 12px; }
    .copy-code {
      position: absolute; top: 6px; right: 6px;
      padding: 2px 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
    }
    #preview-content pre:hover .copy-code { opacity: 1; }
    #preview-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 14px; color: var(--text-secondary);
      margin: 1em 0; font-style: italic;
    }
    #preview-content ul, #preview-content ol { padding-left: 22px; margin: .75em 0; }
    #preview-content li { margin: .3em 0; }
    #preview-content table {
      width: 100%; border-collapse: collapse;
      margin: 1em 0; font-size: 13px;
    }
    #preview-content th, #preview-content td {
      border: 1px solid var(--border-mid); padding: 7px 12px; text-align: left;
    }
    #preview-content th { background: var(--bg-secondary); font-weight: 600; }
    #preview-content a { color: var(--accent); text-decoration: none; }
    #preview-content a:hover { text-decoration: underline; }
    #preview-content hr { border: none; border-top: 1px solid var(--border-mid); margin: 1.5em 0; }
    #preview-content img { max-width: 100%; border-radius: 6px; }
    #preview-content input[type="checkbox"] { margin-right: 5px; cursor: default; }
    #preview-content .mermaid { text-align: center; margin: 1em 0; }
    #preview-content .katex-display { margin: 1em 0; overflow-x: auto; overflow-y: hidden; }

    /* ── Outline ──────────────────────────────────────────── */
    #outline-pane {
      width: var(--outline-w);
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    #outline-pane.hidden { display: none; }
    .outline-list { padding: 6px 0; }
    .outline-item {
      padding: 4px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background .1s, color .1s;
      border-left: 2px solid transparent;
    }
    .outline-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .outline-item.h2 { padding-left: 24px; }
    .outline-item.h3 { padding-left: 34px; font-size: 11px; }
    .outline-item.h4 { padding-left: 44px; font-size: 11px; color: var(--text-muted); }

    /* ── CodeMirror overrides ─────────────────────────────── */
    .CodeMirror {
      height: 100% !important;
      background: var(--bg-primary) !important;
      color: var(--text-primary) !important;
      font-family: 'JetBrains Mono', 'Fira Code', 'Monaco', monospace !important;
      font-size: 13px !important;
      line-height: 1.75 !important;
    }
    .CodeMirror-scroll   { padding: 24px 28px !important; }
    .CodeMirror-gutters  { background: var(--bg-primary) !important; border-right: none !important; display: none !important; }
    .CodeMirror-cursor   {
      border-left: 2px solid var(--accent) !important;
      animation: caret 1s steps(1) infinite;
    }
    @keyframes caret { 50% { opacity: 0 } }
    .CodeMirror-selected { background: var(--accent-bg) !important; }
    .cm-header  { color: var(--accent-text) !important; font-weight: 600 !important; }
    .cm-strong  { font-weight: 600 !important; }
    .cm-em      { font-style: italic !important; }
    .cm-link, .cm-url { color: var(--accent) !important; }
    .cm-comment { color: var(--text-muted) !important; }

    /* ── Scrollbar ────────────────────────────────────────── */
    ::-webkit-scrollbar             { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track       { background: transparent; }
    ::-webkit-scrollbar-thumb       { background: var(--border-mid); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── Command palette ─────────────────────────────────── */
    #palette-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-start; justify-content: center;
      padding-top: 12vh;
      z-index: 50;
      animation: fadein .15s var(--ease);
    }
    #palette-overlay.open { display: flex; }
    #palette {
      width: min(560px, 92vw);
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: pop .2s var(--ease);
    }
    @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98) } to { opacity: 1; transform: none } }
    #palette-input {
      width: 100%;
      padding: 14px 18px;
      background: transparent;
      border: none; outline: none;
      color: var(--text-primary);
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    #palette-list { max-height: 50vh; overflow-y: auto; }
    .pal-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 18px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-primary);
    }
    .pal-item.active { background: var(--accent-bg); color: var(--accent-text); }
    .pal-item .pal-icon { color: var(--text-muted); width: 18px; }
    .pal-item .pal-meta { margin-left: auto; font-size: 11px; color: var(--text-muted); }
    .pal-empty { padding: 18px; text-align: center; color: var(--text-muted); font-size: 12px; }

    /* ── Slash menu ──────────────────────────────────────── */
    #slash-menu {
      position: absolute;
      display: none;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      width: 220px;
      max-height: 280px; overflow-y: auto;
      z-index: 30;
      animation: fadein .12s var(--ease);
    }
    #slash-menu.open { display: block; }
    .slash-item {
      padding: 7px 12px;
      cursor: pointer;
      font-size: 12px; color: var(--text-primary);
      display: flex; gap: 8px; align-items: center;
    }
    .slash-item.active { background: var(--accent-bg); color: var(--accent-text); }
    .slash-icon { width: 16px; color: var(--text-muted); font-family: monospace; }

    /* ── Toasts ──────────────────────────────────────────── */
    #toasts {
      position: fixed; bottom: 18px; right: 18px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 100;
      pointer-events: none;
    }
    .toast {
      padding: 10px 14px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      color: var(--text-primary);
      font-size: 12px;
      min-width: 200px; max-width: 320px;
      animation: slidein .25s var(--ease);
      pointer-events: auto;
      display: flex; gap: 10px; align-items: center;
    }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error   { border-left: 3px solid var(--danger); }
    .toast.info    { border-left: 3px solid var(--accent); }
    .toast.fadeout { animation: slideout .2s var(--ease) forwards; }
    .toast button {
      background: none; border: none; color: var(--accent);
      cursor: pointer; font-size: 12px; padding: 0; margin-left: auto;
    }
    @keyframes slidein  { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    @keyframes slideout { to   { opacity: 0; transform: translateY(8px) } }

    /* ── Drag drop overlay ──────────────────────────────── */
    #drop-overlay {
      position: fixed; inset: 0;
      background: var(--accent-soft);
      border: 3px dashed var(--accent);
      display: none;
      align-items: center; justify-content: center;
      font-size: 16px; color: var(--accent-text);
      z-index: 80;
      pointer-events: none;
    }
    #drop-overlay.open { display: flex; }

    /* ── Mobile ──────────────────────────────────────────── */
    @media (max-width: 800px) {
      :root { --sidebar-w: 280px; }
      #menu-btn { display: inline-flex; }
      #sidebar {
        position: fixed; left: 0; top: 46px; bottom: 0;
        z-index: 20;
        transform: translateX(-100%);
        transition: transform .25s var(--ease);
        box-shadow: var(--shadow-lg);
      }
      #sidebar.open { transform: none; }
      #sidebar-backdrop {
        display: none;
        position: fixed; inset: 46px 0 0 0;
        background: rgba(0,0,0,.4);
        z-index: 15;
      }
      #sidebar.open + #sidebar-backdrop,
      #sidebar-backdrop.open { display: block; }
      #outline-pane { display: none !important; }
      .resizer { display: none; }
      #editor-pane, #preview-pane { flex: 1 1 100%; }
      body[data-pane="editor"]  #preview-pane { display: none; }
      body[data-pane="preview"] #editor-pane  { display: none; }
      body[data-pane="split"]   #editor-pane,
      body[data-pane="split"]   #preview-pane { display: flex; }
      .word-count { display: none; }
    }

    /* ── Print ────────────────────────────────────────────── */
    @media print {
      body { overflow: visible; }
      #topbar, #sidebar, #toolbar, #editor-pane, #outline-pane,
      .pane-label, #find-bar, .resizer, .copy-code, #toasts { display: none !important; }
      #app, #main, #workspace, #preview-pane, #preview-scroll, #preview-body {
        display: block !important; height: auto !important; overflow: visible !important; flex: none !important;
      }
      #preview-content {
        max-width: none; color: #000; font-size: 12pt;
      }
      a { color: #000; text-decoration: underline; }
      pre, code { background: #f5f5f5 !important; color: #000 !important; }
    }

    /* prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.0/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<script>
/* ============================================================
   Notion-lite — Markdown Editor (v2)
   ============================================================ */
'use strict';

// ── IndexedDB ───────────────────────────────────────────────
const DB_NAME = 'NotesDB';
const DB_VER  = 2;
const STORE_NOTES     = 'notes';
const STORE_SNAPSHOTS = 'snapshots';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e) => {
      const idb = e.target.result;
      if (!idb.objectStoreNames.contains(STORE_NOTES)) {
        const s = idb.createObjectStore(STORE_NOTES, { keyPath: 'id' });
        s.createIndex('updatedAt', 'updatedAt');
      }
      if (!idb.objectStoreNames.contains(STORE_SNAPSHOTS)) {
        const s = idb.createObjectStore(STORE_SNAPSHOTS, { keyPath: 'id' });
        s.createIndex('noteId', 'noteId');
        s.createIndex('createdAt', 'createdAt');
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror   = (e) => reject(e.target.error);
  });
}

function tx(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    const req = fn(s);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

const dbGetAll       = ()   => tx(STORE_NOTES, 'readonly',  s => s.getAll());
const dbPut          = note => tx(STORE_NOTES, 'readwrite', s => s.put(note));
const dbDelete       = id   => tx(STORE_NOTES, 'readwrite', s => s.delete(id));
const dbSnapPut      = sn   => tx(STORE_SNAPSHOTS, 'readwrite', s => s.put(sn));
const dbSnapByNote   = id   => tx(STORE_SNAPSHOTS, 'readonly',  s => s.index('noteId').getAll(id));
const dbSnapDelete   = id   => tx(STORE_SNAPSHOTS, 'readwrite', s => s.delete(id));
const dbSnapAll      = ()   => tx(STORE_SNAPSHOTS, 'readonly',  s => s.getAll());

// ── State ──────────────────────────────────────────────────
let notes = [];
let activeId = null;
let editor = null;
let saveTm = null;
let prevTm = null;
let outlineTm = null;
let saveCount = 0;            // for snapshot cadence
let searchQuery = '';
let activeTag = null;
let scrollSyncing = false;
let katexLoaded = false;
let mermaidLoaded = false;

// ── Helpers ────────────────────────────────────────────────
const byPinThenDate = (a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt - a.updatedAt;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const $   = (sel) => document.querySelector(sel);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtDate(ts) {
  const diff = Date.now() - ts;
  if (diff < 60_000)    return 'just now';
  if (diff < 3_600_000) return `${Math.floor(diff / 60_000)}m ago`;
  if (diff < 86_400_000)return `${Math.floor(diff / 3_600_000)}h ago`;
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function safeFilename(s) {
  return (s || 'untitled').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 80);
}
function setSaveStatus(state) {
  const el = $('#save-status');
  el.className = state;
  el.textContent = state === 'saving' ? 'saving…' : state === 'saved' ? '✓ saved' : '—';
}
function migrate(n) {
  if (typeof n.pinned !== 'boolean') n.pinned = false;
  if (!Array.isArray(n.tags))        n.tags = [];
  return n;
}
function extractTags(content) {
  const tags = new Set();
  const re = /(?:^|\s)#([a-zA-Z][\w-]{0,30})/g;
  let m;
  while ((m = re.exec(content)) !== null) tags.add(m[1].toLowerCase());
  return [...tags];
}

// ── Toasts ─────────────────────────────────────────────────
function toast(msg, kind = 'info', actions = []) {
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.innerHTML = `<span>${esc(msg)}</span>`;
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.textContent = a.label;
    btn.onclick = () => { a.onClick(); dismiss(); };
    t.appendChild(btn);
  });
  $('#toasts').appendChild(t);
  let dismissed = false;
  function dismiss() {
    if (dismissed) return; dismissed = true;
    t.classList.add('fadeout');
    setTimeout(() => t.remove(), 220);
  }
  setTimeout(dismiss, 4200);
  return dismiss;
}

// ── Preview rendering ──────────────────────────────────────
const renderer = new marked.Renderer();
renderer.code = (code, lang) => {
  const cls = lang || '';
  let body;
  if (cls === 'mermaid') {
    body = `<div class="mermaid">${esc(code)}</div>`;
    queueMermaid();
    return body;
  }
  let highlighted = esc(code);
  if (window.hljs) {
    try {
      highlighted = lang && hljs.getLanguage(lang)
        ? hljs.highlight(code, { language: lang, ignoreIllegals: true }).value
        : hljs.highlightAuto(code).value;
    } catch {}
  }
  return `<pre><button class="copy-code" data-copy>Copy</button><code class="hljs ${cls ? 'language-' + cls : ''}">${highlighted}</code></pre>`;
};
marked.setOptions({ renderer, gfm: true, breaks: true });

function updatePreview() {
  const content = editor ? editor.getValue() : '';
  const empty   = $('#empty-wrap');
  const preview = $('#preview-content');

  if (!content.trim()) {
    empty.style.display   = 'flex';
    preview.style.display = 'none';
    updateOutline('');
    updateWordCount('');
    return;
  }

  empty.style.display   = 'none';
  preview.style.display = 'block';

  // KaTeX placeholders → render after marked
  const hasMath = /\$\$[\s\S]+?\$\$|\$[^\n$]+\$/.test(content);
  const html    = marked.parse(content);
  preview.innerHTML = DOMPurify.sanitize(html, { ADD_ATTR: ['data-copy'] });

  if (hasMath) renderMath(preview);
  if (mermaidLoaded && window.mermaid) {
    try { mermaid.run({ nodes: preview.querySelectorAll('.mermaid') }); } catch {}
  }

  updateOutline(content);
  updateWordCount(content);
}

// ── Word count + reading time ─────────────────────────────
function updateWordCount(content) {
  const words = content.trim() ? content.trim().split(/\s+/).length : 0;
  const chars = content.length;
  $('#word-count').textContent = `${words} words · ${chars} chars`;
  const mins = Math.max(1, Math.round(words / 220));
  $('#reading-time').textContent = words ? `~${mins} min read` : '';
}

// ── Outline ───────────────────────────────────────────────
function updateOutline(content) {
  const list = $('#outline-list');
  if (!list) return;
  const lines = content.split('\n');
  const headings = [];
  let inFence = false;
  lines.forEach((l, i) => {
    if (/^```/.test(l)) inFence = !inFence;
    if (inFence) return;
    const m = l.match(/^(#{1,4})\s+(.+)$/);
    if (m) headings.push({ level: m[1].length, text: m[2].trim(), line: i });
  });
  if (!headings.length) {
    list.innerHTML = '<div style="padding:10px 14px;font-size:11px;color:var(--text-muted)">No headings yet.</div>';
    return;
  }
  list.innerHTML = headings.map(h =>
    `<div class="outline-item h${h.level}" data-line="${h.line}">${esc(h.text)}</div>`
  ).join('');
  list.querySelectorAll('.outline-item').forEach(el => {
    el.onclick = () => {
      const line = +el.dataset.line;
      editor.scrollIntoView({ line, ch: 0 }, 100);
      editor.setCursor(line, 0);
      editor.focus();
    };
  });
}

// ── KaTeX (lazy) ───────────────────────────────────────────
function loadCss(href) {
  return new Promise((res) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = href; l.onload = res; l.onerror = res;
    document.head.appendChild(l);
  });
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function ensureKatex() {
  if (katexLoaded) return;
  await Promise.all([
    loadCss('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css'),
    loadScript('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js'),
  ]);
  await loadScript('https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js');
  katexLoaded = true;
}
async function renderMath(el) {
  await ensureKatex();
  if (!window.renderMathInElement) return;
  try {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$',  right: '$',  display: false },
      ],
      throwOnError: false,
    });
  } catch {}
}

// ── Mermaid (lazy) ─────────────────────────────────────────
let mermaidQueued = false;
async function queueMermaid() {
  if (mermaidQueued) return;
  mermaidQueued = true;
  if (!mermaidLoaded) {
    await loadScript('https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js');
    if (window.mermaid) {
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });
      mermaidLoaded = true;
    }
  }
  // Render after current preview render flushes
  setTimeout(() => {
    mermaidQueued = false;
    if (window.mermaid) {
      try { mermaid.run({ nodes: document.querySelectorAll('#preview-content .mermaid') }); } catch {}
    }
  }, 30);
}

// ── Notes CRUD ─────────────────────────────────────────────
function createNote(template) {
  const note = migrate({
    id: uid(),
    title: 'Untitled',
    content: template ?? (notes.length === 0 ? WELCOME_NOTE : ''),
    createdAt: Date.now(),
    updatedAt: Date.now(),
    pinned: false,
    tags: [],
  });
  notes.unshift(note);
  dbPut(note);
  renderSidebar();
  loadNote(note.id);
  toast('Note created', 'success');
}

function loadNote(id) {
  if (id === activeId) return;
  if (saveTm) { clearTimeout(saveTm); saveTm = null; saveNote(); }

  activeId = id;
  const note = notes.find(n => n.id === id);
  if (!note) return;

  editor.off('change', onEditorChange);
  editor.setValue(note.content);
  editor.on('change', onEditorChange);

  $('#note-title').value = note.title;
  $('#pin-toggle').classList.toggle('pinned', !!note.pinned);
  editor.focus();
  updatePreview();
  setSaveStatus('saved');
  renderSidebar();
}

async function saveNote() {
  if (!activeId) return;
  const note = notes.find(n => n.id === activeId);
  if (!note) return;

  const content = editor.getValue();
  const titleEl = $('#note-title');

  const typed = titleEl.value.trim();
  if (typed && typed !== 'Untitled') {
    note.title = typed;
  } else if (content.trim()) {
    const firstLine = content.split('\n').find(l => l.trim());
    const derived   = firstLine ? firstLine.replace(/^#+\s*/, '').trim().slice(0, 60) : '';
    note.title    = derived || 'Untitled';
    titleEl.value = note.title === 'Untitled' ? '' : note.title;
  } else {
    note.title = 'Untitled';
  }

  note.content   = content;
  note.tags      = extractTags(content);
  note.updatedAt = Date.now();
  notes.sort(byPinThenDate);

  await dbPut(note);

  // Snapshot every 10 saves
  saveCount++;
  if (saveCount % 10 === 0 && content.trim()) {
    await dbSnapPut({ id: uid(), noteId: note.id, content, createdAt: Date.now() });
    pruneSnapshots(note.id, 20);
  }

  setSaveStatus('saved');
  renderSidebar();
  flashActiveRow();
}

async function pruneSnapshots(noteId, keep) {
  const snaps = await dbSnapByNote(noteId);
  snaps.sort((a, b) => b.createdAt - a.createdAt);
  for (const s of snaps.slice(keep)) await dbSnapDelete(s.id);
}

function forceSave() {
  clearTimeout(saveTm); saveTm = null;
  saveNote();
}

async function deleteNote(id, evt) {
  evt && evt.stopPropagation();
  const idx = notes.findIndex(n => n.id === id);
  if (idx === -1) return;
  const removed = notes[idx];
  notes.splice(idx, 1);
  await dbDelete(id);

  if (activeId === id) {
    if (notes.length > 0) {
      activeId = null;
      loadNote(notes[0].id);
    } else {
      activeId = null;
      editor.off('change', onEditorChange);
      editor.setValue('');
      editor.on('change', onEditorChange);
      $('#note-title').value = '';
      $('#preview-content').style.display = 'none';
      $('#empty-wrap').style.display = 'flex';
      setSaveStatus('');
      updateWordCount('');
      updateOutline('');
    }
  }
  renderSidebar();

  // Undo via toast — restores up to 60s
  toast(`Deleted "${removed.title}"`, 'info', [{
    label: 'Undo',
    onClick: async () => {
      notes.push(migrate(removed));
      notes.sort(byPinThenDate);
      await dbPut(removed);
      renderSidebar();
      loadNote(removed.id);
    },
  }]);
}

async function togglePin(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  note.pinned = !note.pinned;
  note.updatedAt = Date.now();
  notes.sort(byPinThenDate);
  await dbPut(note);
  if (id === activeId) $('#pin-toggle').classList.toggle('pinned', note.pinned);
  renderSidebar();
}

function renderTagBar() {

// ── Toolbar actions ────────────────────────────────────────
function fmt(before, after) {
  const sel = editor.getSelection();
  editor.replaceSelection(before + (sel || 'text') + after);
  if (!sel) {
    const c = editor.getCursor();
    editor.setCursor({ line: c.line, ch: c.ch - after.length });
  }
  editor.focus();
}
function ln(prefix) {
  const cur = editor.getCursor();
  const line = editor.getLine(cur.line);
  if (line.trim() === '') {
    editor.replaceRange(prefix, { line: cur.line, ch: 0 }, { line: cur.line, ch: line.length });
    editor.setCursor({ line: cur.line, ch: prefix.length });
  } else {
    editor.replaceRange('\n' + prefix, { line: cur.line, ch: line.length });
    editor.setCursor({ line: cur.line + 1, ch: prefix.length });
  }
  editor.focus();
}
function codeBlock() {
  const cur = editor.getCursor();
  const line = editor.getLine(cur.line);
  const snippet = '\n```js\n\n```';
  editor.replaceRange(snippet, { line: cur.line, ch: line.length });
  editor.setCursor({ line: cur.line + 2, ch: 0 });
  editor.focus();
}
function insertLink() {
  const sel = editor.getSelection() || 'link text';
  editor.replaceSelection(`[${sel}](https://)`);
  const c = editor.getCursor();
  editor.setCursor({ line: c.line, ch: c.ch - 1 });
  editor.focus();
}

// ── Slash menu ─────────────────────────────────────────────
const SLASH_ITEMS = [
  { label: 'Heading 1',     icon: 'H1', action: () => ln('# ') },
  { label: 'Heading 2',     icon: 'H2', action: () => ln('## ') },
  { label: 'Heading 3',     icon: 'H3', action: () => ln('### ') },
  { label: 'Bullet list',   icon: '•',  action: () => ln('- ') },
  { label: 'Numbered list', icon: '1.', action: () => ln('1. ') },
  { label: 'To-do',         icon: '☐',  action: () => ln('- [ ] ') },
  { label: 'Quote',         icon: '"',  action: () => ln('> ') },
  { label: 'Code block',    icon: '{}', action: () => codeBlock() },
  { label: 'Divider',       icon: '—',  action: () => ln('---') },
  { label: 'Table',         icon: '⊞',  action: () => ln('| Col1 | Col2 |\n|------|------|\n| A    | B    |') },
  { label: 'Math block',    icon: '∑',  action: () => ln('$$\n\n$$') },
  { label: 'Mermaid',       icon: '◇',  action: () => ln('```mermaid\ngraph LR\n  A --> B\n```') },
];
let slashState = null;

function detectSlash() {
  const cur = editor.getCursor();
  const line = editor.getLine(cur.line);
  const before = line.slice(0, cur.ch);
  const m = before.match(/(?:^|\s)(\/[\w]*)$/);
  if (!m) { hideSlash(); return; }
  const query = m[1].slice(1).toLowerCase();
  showSlash(query, cur, m[1].length);
}
function showSlash(query, cur, tokenLen) {
  const filtered = SLASH_ITEMS.filter(i => i.label.toLowerCase().includes(query));
  if (!filtered.length) { hideSlash(); return; }
  slashState = { items: filtered, idx: 0, cur, tokenLen };
  const menu = $('#slash-menu');
  menu.innerHTML = filtered.map((it, i) =>
    `<div class="slash-item${i === 0 ? ' active' : ''}" data-i="${i}"><span class="slash-icon">${esc(it.icon)}</span>${esc(it.label)}</div>`
  ).join('');
  // Position near caret
  const coords = editor.cursorCoords(true, 'page');
  const wrap = $('#editor-wrap').getBoundingClientRect();
  menu.style.left = (coords.left - wrap.left) + 'px';
  menu.style.top  = (coords.bottom - wrap.top + 4) + 'px';
  menu.classList.add('open');

  menu.querySelectorAll('.slash-item').forEach(el => {
    el.onmouseenter = () => setSlashIdx(+el.dataset.i);
    el.onclick      = () => commitSlash();
  });
}
function setSlashIdx(i) {
  if (!slashState) return;
  slashState.idx = i;
  $('#slash-menu').querySelectorAll('.slash-item').forEach((el, j) => el.classList.toggle('active', i === j));
}
function commitSlash() {
  if (!slashState) return;
  const { items, idx, cur, tokenLen } = slashState;
  // Remove the '/query' token first
  editor.replaceRange('', { line: cur.line, ch: cur.ch - tokenLen }, cur);
  hideSlash();
  items[idx].action();
}
function hideSlash() {
  slashState = null;
  $('#slash-menu').classList.remove('open');
}

// ── Find & Replace ─────────────────────────────────────────
let findCursor = null;

function openFind() {
  $('#find-bar').classList.add('open');
  $('#find-input').value = editor.getSelection() || '';
  $('#find-input').focus();
  $('#find-input').select();
}
function closeFind() { $('#find-bar').classList.remove('open'); editor.focus(); }

function findNext(reverse = false) {
  const q = $('#find-input').value;
  if (!q) return;
  const start = editor.getCursor(reverse ? 'from' : 'to');
  findCursor = editor.getSearchCursor(q, start, { caseFold: true });
  if (!findCursor.find(reverse)) {
    // wrap
    findCursor = editor.getSearchCursor(q, reverse ? { line: editor.lastLine() + 1, ch: 0 } : { line: 0, ch: 0 }, { caseFold: true });
    if (!findCursor.find(reverse)) { toast('No matches', 'info'); return; }
  }
  editor.setSelection(findCursor.from(), findCursor.to());
  editor.scrollIntoView({ from: findCursor.from(), to: findCursor.to() }, 60);
}
function replaceCurrent() {
  if (!findCursor) findNext();
  if (!findCursor) return;
  editor.replaceSelection($('#replace-input').value);
  findNext();
}
function replaceAll() {
  const q = $('#find-input').value, r = $('#replace-input').value;
  if (!q) return;
  let cur = editor.getSearchCursor(q, { line: 0, ch: 0 }, { caseFold: true });
  let count = 0;
  editor.operation(() => {
    while (cur.findNext()) { cur.replace(r); count++; }
  });
  toast(`Replaced ${count}`, count ? 'success' : 'info');
}

// ── Image paste / drop ─────────────────────────────────────
function fileToDataUrl(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload  = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
async function insertImageFromFile(file) {
  if (!file.type.startsWith('image/')) return;
  if (file.size > 2_000_000) {
    toast('Image > 2MB — consider hosting it externally', 'error');
    return;
  }
  const data = await fileToDataUrl(file);
  const alt = file.name.replace(/\.\w+$/, '');
  editor.replaceSelection(`![${alt}](${data})\n`);
  toast('Image inserted', 'success');
}

// ── Export / Import / Print ────────────────────────────────
function download(filename, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}
function exportMd() {
  if (!activeId) return;
  const n = notes.find(x => x.id === activeId);
  download(safeFilename(n.title) + '.md', n.content, 'text/markdown');
}
function exportHtml() {
  if (!activeId) return;
  const n = notes.find(x => x.id === activeId);
  const raw = marked.parse(n.content);
  const clean = DOMPurify.sanitize(raw);
  const doc = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(n.title)}</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 24px;line-height:1.8;color:#1a1a1a}h1,h2,h3,h4{font-weight:600;margin:1.4em 0 .4em}code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:.88em}pre{background:#f3f4f6;padding:14px;border-radius:8px;overflow-x:auto}pre code{background:none}blockquote{border-left:3px solid #2383e2;padding-left:14px;color:#555}table{border-collapse:collapse;width:100%}th,td{border:1px solid #e5e7eb;padding:8px 12px}th{background:#f9fafb}a{color:#2383e2}img{max-width:100%}</style></head><body>${clean}</body></html>`;
  download(safeFilename(n.title) + '.html', doc, 'text/html');
}
async function importMdFiles(fileList) {
  let count = 0;
  for (const file of fileList) {
    if (!/\.(md|markdown|txt)$/i.test(file.name) && !file.type.startsWith('text/')) continue;
    const text = await file.text();
    const note = migrate({
      id: uid(),
      title: file.name.replace(/\.\w+$/, '').slice(0, 80) || 'Imported',
      content: text,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      pinned: false,
      tags: extractTags(text),
    });
    notes.unshift(note);
    await dbPut(note);
    count++;
  }
  if (count) {
    notes.sort(byPinThenDate);
    renderSidebar();
    toast(`Imported ${count} note${count > 1 ? 's' : ''}`, 'success');
  } else {
    toast('No markdown files found', 'error');
  }
}

// ── Pane / outline / theme toggles ─────────────────────────
function togglePane() {
  const cur = document.body.dataset.pane;
  const next = cur === 'split' ? 'editor' : cur === 'editor' ? 'preview' : 'split';
  document.body.dataset.pane = next;
  $('#preview-pane').style.display = (next === 'editor') ? 'none' : '';
  $('#editor-pane').style.display  = (next === 'preview') ? 'none' : '';
  $('#resizer-1').style.display    = (next === 'split') ? '' : 'none';

}
function toggleOutline() {
  $('#outline-pane').classList.toggle('hidden');
  if (editor) setTimeout(() => editor.refresh(), 30);
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.dataset.theme = next;
  else delete document.documentElement.dataset.theme;
  // hl theme swap
  const dark = next === 'dark' || (!next && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#hl-light').disabled = dark;
  $('#hl-dark').disabled  = !dark;
  localStorage.setItem('nl-theme', next || 'system');
}

// ── Resizable panes ────────────────────────────────────────
function setupResizer() {
  const r = $('#resizer-1');
  const ed = $('#editor-pane');
  const pv = $('#preview-pane');
  let startX = 0, startW = 0;
  r.addEventListener('mousedown', (e) => {
    startX = e.clientX;
    startW = ed.getBoundingClientRect().width;
    r.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    function onMove(ev) {
      const dx = ev.clientX - startX;
      const total = ed.parentElement.getBoundingClientRect().width;
      const min = 220;
      const newW = Math.max(min, Math.min(total - min, startW + dx));
      const pct  = (newW / total) * 100;
      ed.style.flex = `0 0 ${pct}%`;
      pv.style.flex = `1 1 ${100 - pct}%`;
    }
    function onUp() {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      r.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      localStorage.setItem('nl-split', ed.style.flex);
      editor && editor.refresh();
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
  // restore
  const saved = localStorage.getItem('nl-split');
  if (saved) {
    ed.style.flex = saved;
    const m = saved.match(/(\d+\.?\d*)%/);
    if (m) pv.style.flex = `1 1 ${100 - +m[1]}%`;
  }
}

// ── Scroll sync ────────────────────────────────────────────
function setupScrollSync() {
  const cm = editor.getScrollerElement();
  const pv = $('#preview-scroll');
  const onCm = () => {
    if (scrollSyncing) return;
    scrollSyncing = true;
    const cmInfo = editor.getScrollInfo();
    const ratio = cmInfo.top / Math.max(1, cmInfo.height - cmInfo.clientHeight);
    pv.scrollTop = ratio * (pv.scrollHeight - pv.clientHeight);
    requestAnimationFrame(() => scrollSyncing = false);
  };
  const onPv = () => {
    if (scrollSyncing) return;
    scrollSyncing = true;
    const ratio = pv.scrollTop / Math.max(1, pv.scrollHeight - pv.clientHeight);
    const cmInfo = editor.getScrollInfo();
    editor.scrollTo(null, ratio * (cmInfo.height - cmInfo.clientHeight));
    requestAnimationFrame(() => scrollSyncing = false);
  };
  cm.addEventListener('scroll', onCm);
  pv.addEventListener('scroll', onPv);
}

// ── Init ───────────────────────────────────────────────────
async function init() {
  // Theme from storage
  const savedTheme = localStorage.getItem('nl-theme');
  if (savedTheme && savedTheme !== 'system') document.documentElement.dataset.theme = savedTheme;
  const dark = (savedTheme === 'dark') || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#hl-light').disabled = dark;
  $('#hl-dark').disabled  = !dark;

  db = await openDB();
  notes = (await dbGetAll()).map(migrate);
  notes.sort(byPinThenDate);

  editor = CodeMirror.fromTextArea($('#cm-target'), {
    mode: 'markdown', theme: 'default',
    lineWrapping: true, autofocus: false,
    tabSize: 2, indentWithTabs: false,
    extraKeys: {
      'Ctrl-B': () => fmt('**', '**'),  'Cmd-B': () => fmt('**', '**'),
      'Ctrl-I': () => fmt('*', '*'),    'Cmd-I': () => fmt('*', '*'),
      'Ctrl-S': () => forceSave(),       'Cmd-S': () => forceSave(),
      'Ctrl-F': () => openFind(),        'Cmd-F': () => openFind(),
      'Esc':    () => { hideSlash(); closeFind(); },
    },
  });
  editor.setSize('100%', '100%');
  editor.on('change', onEditorChange);

  // Slash menu nav
  editor.on('keydown', (cm, e) => {
    if (!slashState) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setSlashIdx((slashState.idx + 1) % slashState.items.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSlashIdx((slashState.idx - 1 + slashState.items.length) % slashState.items.length); }
    else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); commitSlash(); }
    else if (e.key === 'Escape') { e.preventDefault(); hideSlash(); }
  });

  // Title input
  const titleEl = $('#note-title');
  titleEl.addEventListener('input', () => {
    if (!activeId) return;
    const n = notes.find(x => x.id === activeId);
    const next = titleEl.value || 'Untitled';
    if (n) n.title = next;
    patchActiveSidebarTitle(next);
    setSaveStatus('saving');
    clearTimeout(saveTm);
    saveTm = setTimeout(saveNote, 500);
  });

  // Search
  $('#search-input').addEventListener('input', debounce((e) => {
    searchQuery = e.target.value;
    renderSidebar();
  }, 80));

  // Tag bar
  $('#tag-bar').addEventListener('click', (e) => {
    const pill = e.target.closest('.tag-pill');
    if (!pill) return;
    activeTag = pill.dataset.tag || null;
    renderSidebar();
  });

  // Sidebar interactions (delegation)
  $('#notes-list').addEventListener('click', (e) => {
    const row = e.target.closest('.ni');
    if (!row) return;
    const id = row.dataset.id;
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (action === 'delete') deleteNote(id, e);
    else if (action === 'pin') { e.stopPropagation(); togglePin(id); }
    else { loadNote(id); if (innerWidth <= 800) closeDrawer(); }
  });

  // Buttons
  $('#new-btn').onclick = () => createNote();
  $('#tpl-btn').onclick = () => promptTemplate();
  $('#palette-btn').onclick = () => openPalette();
  $('#pin-toggle').onclick = () => activeId && togglePin(activeId);
  $('#view-toggle').onclick = () => togglePane();
  $('#outline-toggle').onclick = () => toggleOutline();
  $('#menu-btn').onclick = () => toggleDrawer();
  $('#sidebar-backdrop').onclick = () => closeDrawer();

  // Find bar
  $('#find-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); findNext(e.shiftKey); }
    else if (e.key === 'Escape') closeFind();
  });
  $('#find-prev').onclick = () => findNext(true);
  $('#find-next').onclick = () => findNext();
  $('#find-replace').onclick = replaceCurrent;
  $('#find-replace-all').onclick = replaceAll;
  $('#find-close').onclick = closeFind;

  // Palette
  $('#palette-input').addEventListener('input', (e) => renderPaletteList(e.target.value));
  $('#palette-input').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setPaletteIdx(paletteIdx + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setPaletteIdx(paletteIdx - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); commitPalette(); }
    else if (e.key === 'Escape') closePalette();
  });
  $('#palette-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'palette-overlay') closePalette();
  });

  // Preview: copy code & checkbox toggle
  $('#preview-content').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-copy]');
    if (btn) {
      const code = btn.parentElement.querySelector('code')?.innerText || '';
      navigator.clipboard.writeText(code).then(() => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1100); });
    }
  });

  // Image paste
  document.addEventListener('paste', (e) => {
    if (!editor.hasFocus()) return;
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (!item) return;
    e.preventDefault();
    insertImageFromFile(item.getAsFile());
  });

  // Drop import / image
  let dragDepth = 0;
  document.addEventListener('dragenter', (e) => {
    if (![...(e.dataTransfer?.items || [])].some(i => i.kind === 'file')) return;
    dragDepth++;
    $('#drop-overlay').classList.add('open');
  });
  document.addEventListener('dragover',  (e) => { e.preventDefault(); });
  document.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop-overlay').classList.remove('open'); });
  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragDepth = 0;
    $('#drop-overlay').classList.remove('open');
    const files = [...(e.dataTransfer?.files || [])];
    const images = files.filter(f => f.type.startsWith('image/'));
    const docs   = files.filter(f => /\.(md|markdown|txt)$/i.test(f.name) || f.type.startsWith('text/'));
    if (images.length && editor) for (const img of images) await insertImageFromFile(img);
    if (docs.length) await importMdFiles(docs);
  });

  // Md file input
  $('#md-file').addEventListener('change', (e) => {
    if (e.target.files.length) importMdFiles(e.target.files);
    e.target.value = '';
  });

  // Global hotkeys
  window.addEventListener('keydown', (e) => {
    const meta = e.ctrlKey || e.metaKey;
    if (meta && e.key.toLowerCase() === 'k')        { e.preventDefault(); openPalette(); }
    else if (meta && !e.shiftKey && e.key.toLowerCase() === 'n')   { e.preventDefault(); createNote(); }
    else if (meta && e.shiftKey && e.key.toLowerCase() === 'p')    { e.preventDefault(); togglePane(); }
    else if (e.key === 'Escape' && $('#palette-overlay').classList.contains('open')) closePalette();
  });

  // Drawer for mobile
  function toggleDrawer() { $('#sidebar').classList.toggle('open'); $('#sidebar-backdrop').classList.toggle('open'); }
  function closeDrawer()  { $('#sidebar').classList.remove('open'); $('#sidebar-backdrop').classList.remove('open'); }
  window.toggleDrawer = toggleDrawer; window.closeDrawer = closeDrawer;

  // Resizer + scroll sync
  setupResizer();
  setupScrollSync();

  // Slash menu - hide on click outside
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('#slash-menu')) hideSlash();
  });

  // Service worker
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  renderSidebar();

  if (notes.length > 0) loadNote(notes[0].id);
  else createNote();
}

// Expose toolbar fns for inline onclick
window.fmt = fmt; window.ln = ln; window.codeBlock = codeBlock; window.insertLink = insertLink;
window.exportMd = exportMd; window.exportHtml = exportHtml;

init().catch(err => {
  console.error('Init error:', err);
  toast('Init failed: ' + err.message, 'error');
});
</script>
